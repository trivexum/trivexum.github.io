    <div class="container">

            <div id="weatherInfo">No data yet.</div>
        </div>

        <div class="container" id="airCard">

            <div id="airInfo">No data yet.</div>
        </div>

        <div class="container">

    </div>

        ecoFact.textContent = facts[Math.floor(Math.random() * facts.length)];

        async function getWeatherAndAir(city) {
            try {
                const geoRes = await fetch(
                    `https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${API_KEY}`
                );
                const geoData = await geoRes.json();
                if (!geoData.length) {
                    weatherInfo.textContent = "City not found.";
                    airInfo.textContent = "—";
                    return;
                }

                const { lat, lon } = geoData[0];
                const weatherRes = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
                );
                const weatherData = await weatherRes.json();

                const airRes = await fetch(
                    `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`
                );
                const airData = await airRes.json();

                displayWeather(weatherData);
                displayAir(airData);
            } catch (error) {
                console.error(error);
                weatherInfo.textContent = "Error fetching data.";
                airInfo.textContent = "Error fetching data.";
            }
        }

        function displayWeather(data) {
            const { name, main, weather } = data;
            weatherInfo.innerHTML = `
        <div class="data-item"><strong>City:</strong> <span>${name}</span></div>
        <div class="data-item"><strong>Temperature:</strong> <span>${main.temp}°C</span></div>
        <div class="data-item"><strong>Condition:</strong> <span>${weather[0].description}</span></div>
        <div class="data-item"><strong>Humidity:</strong> <span>${main.humidity}%</span></div>
      `;
        }

        function displayAir(data) {
            const aqi = data.list[0].main.aqi;
            const comps = data.list[0].components;
            const levels = ["Good", "Fair", "Moderate", "Poor", "Very Poor"];
            airInfo.innerHTML = `
        <div class="data-item"><strong>AQI:</strong> <span>${aqi} (${levels[aqi - 1]})</span></div>
        <div class="data-item"><strong>PM2.5:</strong> <span>${comps.pm2_5}</span></div>
        <div class="data-item"><strong>PM10:</strong> <span>${comps.pm10}</span></div>
        <div class="data-item"><strong>NO₂:</strong> <span>${comps.no2}</span></div>
        <div class="data-item"><strong>O₃:</strong> <span>${comps.o3}</span></div>
      `;
        }

        searchBtn.addEventListener("click", () => {
            const city = cityInput.value.trim();
            if (city) getWeatherAndAir(city);
        });

        themeToggle.addEventListener("click", () => {
            const theme = body.getAttribute("data-theme") === "light" ? "dark" : "light";
            body.setAttribute("data-theme", theme);
            themeToggle.textContent = theme === "light" ? "🌙" : "☀️";
        });
    </script>
