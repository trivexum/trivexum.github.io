<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoulSync | TRIVEXUM</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="shortcut icon" href="../icon.png" type="image/x-icon" />

  <script src="https://kit.fontawesome.com/5ba3ca3a53.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade:wght@700&family=Amiri:wght@700&display=swap"
    rel="stylesheet">
  <style>
    .icon-combo {
      position: relative;
      width: 70px;
      margin: auto;
      height: 70px;
    }

    .icon-combo i {
      position: absolute;
      font-size: 60px;
      color: #fff;
    }

    /* Moon as base */
    .icon-combo .fa-moon {
      left: 0;
      top: 5px;
      color: var(--color-accent);
    }

    /* Dove flying across */
    .icon-combo .fa-dove {
      left: 18px;
      top: -5px;
      color: var(--color-primary);
      transform: rotate(-10deg);
    }

    /* Sparkles for divine touch */
    .icon-combo .fa-sparkles {
      left: 40px;
      top: -10px;
      font-size: 22px;
      color: #fceaff;
    }

    .question {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .answers button {
      margin: 10px auto;
      width: 100%;
    }

    .answers button:hover {
      animation: pulse 2s infinite;
    }

    .result {
      font-size: 1.1rem;
      margin-top: 15px;
    }

    .ayah-arabic {
      font-family: "Scheherazade", "Amiri", serif !important;
      font-size: 2rem !important;
      direction: rtl;
      margin-bottom: 10px !important;
    }

    .reflection {
      margin-top: 10px;
      font-style: italic;
      color: var(--color-light-text);
    }
  </style>
</head>

<body>

  <nav id="navbar">
    <div class="nav-left">
      <img src="../icon.png" alt="Icon">
      <p>TRIVEXUM</p>
    </div>
    <div class="nav-right">
      <a href="../index.html"><i class="fas fa-house"></i> Home</a>
      <a href="../projects.html"><i class="fas fa-laptop-code"></i> Projects</a>
      
      <a href="../about.html"><i class="fas fa-user"></i> About</a>
      
      <button id="theme-toggle" aria-label="Toggle Theme">
        <i class="fas fa-moon"></i>
      </button>
    </div>


    <div class="hamburger" onclick="openSidebar()">
      <i class="fas fa-bars"></i>
    </div>
  </nav>

  <div id="sidebar" class="sidebar hidden">
    <div class="sidebar-brand-horizontal">
      <img src="../icon.png" alt="Trivexum Icon" />
      <p>TRIVEXUM</p>
    </div>

    <hr class="sidebar-divider">

    <div class="close-btn" onclick="closeSidebar()">
      <i class="fas fa-times"></i>
    </div>

    <a href="../index.html"><i class="fas fa-house"></i> Home</a>
    <a href="../projects.html"><i class="fas fa-laptop-code"></i> Projects</a>
    
    <a href="../about.html"><i class="fas fa-user"></i> About</a>
    
  </div>

  <div id="overlay" class="overlay hidden" onclick="closeSidebar()"></div>



  <div class="container" id="quiz-container">
    <h1 class="soul-title">
      <div class="icon-combo">
        <i class="fas fa-moon"></i>
        <i class="fas fa-dove"></i>
        <i class="fas fa-sparkles"></i>
      </div>
      SoulSync
    </h1>
    <p class="subtitle">Discover the verse your soul already knows.</p>

    <div id="quiz">
      <p class="question" id="question"></p>
      <div class="answers" id="answers"></div>
    </div>
    <div id="result" style="display:none;">
      <h2>Your Soul Verse</h2>
      <div class="card-container">
        <div class="card" id="verseCard"></div>
      </div>
      <button onclick="restartQuiz()"><i class="fa-solid fa-rotate-right"></i> Retake Quiz</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 TRIVEXUM. All rights reserved.</p>
  </footer>
  <script>
    const questions = [
      { q: "How do you feel most days?", a: ["Calm", "Anxious", "Hopeful", "Lost"] },
      { q: "What drives you the most?", a: ["Faith", "Ambition", "Love", "Curiosity"] },
      { q: "What brings you peace?", a: ["Prayer", "Nature", "Helping others", "Music"] },
      { q: "When faced with challenges, you…", a: ["Trust Allah", "Worry a lot", "Look for solutions", "Ask for help"] },
      { q: "Which word feels closest to your heart?", a: ["Light", "Strength", "Patience", "Knowledge"] },
      { q: "How do you handle sadness?", a: ["I pray", "I isolate", "I talk it out", "I distract myself"] },
      { q: "Pick one symbol:", a: ["🌙", "🔥", "🌿", "🌊"] },
      { q: "What do you seek right now?", a: ["Guidance", "Peace", "Motivation", "Healing"] },
      { q: "What do you fear losing?", a: ["Faith", "Time", "Loved ones", "Myself"] },
      { q: "How do you see your future?", a: ["Bright", "Uncertain", "Balanced", "Unwritten"] }
    ];

    const traitsMap = {
      Calm: "Tranquil",
      Hopeful: "Hopeful",
      Lost: "Lost",
      Faith: "Faithful",
      Healing: "Healing",
      Motivation: "Motivated",
      Ambition: "Motivated",
      Love: "Loving",
      Curiosity: "KnowledgeSeeker",
      Nature: "Tranquil",
      "Helping others": "Loving",
      Prayer: "Faithful",
      "Trust Allah": "Faithful",
      Patience: "Faithful",
      Knowledge: "KnowledgeSeeker",
      Peace: "Tranquil",
      Guidance: "Faithful",
      "Loved ones": "Loving",
      "Ask for help": "Loving",
      "Worry a lot": "Lost",
      "I isolate": "Lost",
      "I distract myself": "Lost",
      Strength: "Motivated",
      "Look for solutions": "Motivated",
      "🌙": "Tranquil",
      "🔥": "Motivated",
      "🌿": "Healing",
      "🌊": "Faithful",
      Bright: "Hopeful",
      Uncertain: "Lost",
      Balanced: "Tranquil",
      Unwritten: "KnowledgeSeeker",
      Time: "Motivated",
      Myself: "Lost",
      "I talk it out": "Loving",
      Music: "Healing"
    };

    const verses = {
      Tranquil: {
        arabic: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
        text: "“Verily, in the remembrance of Allah do hearts find rest.” (13:28)",
        reflection: "Peace flows through your soul — you find calmness in remembrance and reflection."
      },
      Hopeful: {
        arabic: "لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",
        text: "“Do not despair of the mercy of Allah.” (39:53)",
        reflection: "Even when the night is darkest, your faith holds onto the first light of dawn."
      },
      Faithful: {
        arabic: "إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",
        text: "“Indeed, Allah is with the patient.” (2:153)",
        reflection: "Your strength is in your sabr — you walk steady, knowing Allah walks with you."
      },
      Lost: {
        arabic: "وَوَجَدَكَ ضَالًّا فَهَدَىٰ",
        text: "“And He found you lost and guided you.” (93:7)",
        reflection: "Even when confusion clouds your heart, divine guidance quietly pulls you home."
      },
      Healing: {
        arabic: "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ",
        text: "“And We send down of the Qur'an that which is healing and mercy.” (17:82)",
        reflection: "You carry silent wounds — but every verse is a remedy sent for your soul."
      },
      Motivated: {
        arabic: "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا",
        text: "“So indeed, with hardship comes ease.” (94:6)",
        reflection: "You burn bright even when tired — this verse reminds you ease always follows effort."
      },
      Loving: {
        arabic: "وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً",
        text: "“The Most Merciful will plant affection between their hearts.” (30:21)",
        reflection: "Your heart beats for connection and compassion — a reflection of divine mercy."
      },
      KnowledgeSeeker: {
        arabic: "رَّبِّ زِدْنِي عِلْمًا",
        text: "“And say, ‘My Lord, increase me in knowledge.’” (20:114)",
        reflection: "Your soul hungers for wisdom — every discovery is another step toward divine truth."
      }
    };

    let currentQ = 0;
    let score = {};

    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const quizContainer = document.getElementById("quiz");
    const resultContainer = document.getElementById("result");
    const verseCard = document.getElementById("verseCard");

    function showQuestion() {
      const q = questions[currentQ];
      questionEl.textContent = q.q;
      answersEl.innerHTML = "";
      q.a.forEach(ans => {
        const btn = document.createElement("button");
        btn.textContent = ans;
        btn.onclick = () => nextQuestion(ans);
        answersEl.appendChild(btn);
      });
    }

    function nextQuestion(ans) {
      const trait = traitsMap[ans];
      if (trait) score[trait] = (score[trait] || 0) + 1;
      currentQ++;
      if (currentQ < questions.length) showQuestion();
      else showResult();
    }

    function showResult() {
      quizContainer.style.display = "none";
      resultContainer.style.display = "block";

      if (Object.keys(score).length === 0) {
        verseCard.innerHTML = `<p><strong>Take the quiz to reveal your verse!</strong></p>`;
        return;
      }

      const maxScore = Math.max(...Object.values(score));
      const topTraits = Object.keys(score).filter(t => score[t] === maxScore);
      const dominant = topTraits[Math.floor(Math.random() * topTraits.length)];
      const verse = verses[dominant] || verses.Faithful;

      verseCard.innerHTML = `
        <h2 class="ayah-arabic">${verse.arabic}</h2>
        <p class="ayah-english"><strong>${verse.text}</strong></p>
        <p class="reflection">${verse.reflection}</p>
      `;
      localStorage.setItem("soulVerse", JSON.stringify(verse));
    }

    function restartQuiz() {
      currentQ = 0;
      score = {};
      quizContainer.style.display = "block";
      resultContainer.style.display = "none";
      localStorage.removeItem("soulVerse");
      showQuestion();
    }

    const savedVerse = localStorage.getItem("soulVerse");
    if (savedVerse) {
      const verse = JSON.parse(savedVerse);
      if (verse.arabic) {
        quizContainer.style.display = "none";
        resultContainer.style.display = "block";
        verseCard.innerHTML = `
      <h2 class="ayah-arabic">${verse.arabic}</h2>
      <p class="ayah-english"><strong>${verse.text}</strong></p>
      <p class="reflection">${verse.reflection}</p>
    `;
      } else {
        // Old data format – clear and restart
        localStorage.removeItem("soulVerse");
        showQuestion();
      }
    } else {
      showQuestion();
    } 
  </script>
  <script src="../script.js"></script>
</body>

</html>
